name: Python tests and coverage

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install test tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Installed CLI smoke test
      run: vibe-explainer --version
    - name: Run test suite (pytest)
      run: |
        python -m pytest
    - name: Reproduce detection-quality metrics
      run: |
        python -m vibe_explainer.validation --output validation/metrics.json --metrics-gate --check
        git diff --exit-code -- validation/metrics.json
    - name: Run tests with branch coverage
      run: |
        python -m coverage run -m pytest
        python -m coverage report
    - name: Build distributions
      if: matrix.python-version == '3.14'
      run: python -m build
