[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-explainer"
dynamic = ["version"]
description = "Offline static AI repository evidence review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vibe Explainer contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["build>=1.2", "coverage>=7.6", "pytest>=8"]

[project.scripts]
vibe-explainer = "vibe_explainer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "vibe_explainer.__version__"}

[tool.setuptools.packages.find]
include = ["vibe_explainer*"]

[tool.coverage.run]
branch = true
source = ["vibe_explainer"]

[tool.coverage.report]
fail_under = 90
show_missing = true
